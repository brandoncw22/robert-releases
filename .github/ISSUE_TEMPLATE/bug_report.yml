name: Bug report
description: Report a problem with a Robert release on Windows or Linux.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a defect in a Robert release.

        Issues in this repository are public. Remove secrets before you submit: tokens, passwords, API keys, cookies, connection strings, and private paths (including paths inside `robert doctor` output).

        Supported platforms are Windows and Linux. macOS is not supported. No release is published yet. The first release ships six assets: `robert-<version>-windows-x64.zip`, `robert-<version>-linux-x64.tar.gz`, `robert-<version>-windows-x64-install.ps1`, `robert-<version>-linux-x64-install.mjs`, `exec-json.schema.json`, and `SHA256SUMS`. There is no `RobertSetup.exe`.

  - type: input
    id: robert-version
    attributes:
      label: Robert version
      description: The release you installed. Include the version the CLI prints, when it prints one.
      placeholder: release tag or version string
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Windows and Linux are the supported platforms. macOS is not supported.
      options:
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      description: Windows build or Linux distribution and version.
      placeholder: Windows 11 24H2, or Ubuntu 24.04
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      description: The model server Robert is talking to.
      options:
        - Ollama
        - OpenAI-compatible server
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model
      description: Name of the model in use.
      placeholder: model name
    validations:
      required: true

  - type: input
    id: provider-version
    attributes:
      label: Provider version
      description: For example, the output of `ollama --version`, or the server name and version.
      placeholder: ollama version is ...
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order. Leave out secrets and private paths.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead. Paste error text here if you have it, with secrets removed.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: robert doctor output
      description: |
        Paste the output of `robert doctor`.
        Remove secrets, tokens, passwords, API keys, cookies, and private paths first.
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: secrets-removed
    attributes:
      label: Secrets removed
      options:
        - label: I removed secrets, tokens, passwords, API keys, cookies, and private paths from this report, including the `robert doctor` output.
          required: true
